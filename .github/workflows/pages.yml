name: Deploy GORE TOWN to Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the packaged build
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gt.tar.gz" "https://litter.catbox.moe/ovth17.gz"
          mkdir -p "$RUNNER_TEMP/stage"
          tar xzf "$RUNNER_TEMP/gt.tar.gz" -C "$RUNNER_TEMP/stage"
          ls -la "$RUNNER_TEMP/stage"
          test -s "$RUNNER_TEMP/stage/index.html"

      - name: Import sources into the repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a "$RUNNER_TEMP/stage/." .
          git add -A
          git commit -m "Import GORE TOWN single-file build and sources" || echo "no changes to commit"
          git push

      - name: Stage the published site
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/stage/index.html" dist/
          cp "$RUNNER_TEMP/stage/logo.png" "$RUNNER_TEMP/stage/logo-512.png" dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
